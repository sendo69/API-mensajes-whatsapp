version: '3.8'

services:
  evolution-api:
    image: atendai/evolution-api:v1.8.3 # Versión v1 altamente estable para WSL
    container_name: evolution_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080 # O el dominio cuando se tenga
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG,VERBOSE,DARK,WEBHOOKS
      # Autenticación global de Evolution (Usada por el Wrapper)
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=${EVOLUTION_GLOBAL_API_KEY:-super_secret_key_123}
      - AUTHENTICATION_EXPOSE_IN_ENV=true
      # Base de Datos de Evolution
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:evolution123@evolution_postgres:5432/evolution?schema=public
      # Redis para cache
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://evolution_redis:6379/0
      # Opciones generales
      - WEBHOOK_GLOBAL_ENABLED=false
      # Fix para Windows WSL / Baileys
      - WA_BROWSER=Evolution API
      - WA_BROWSER_NAME=Chrome
      - WA_BROWSER_VERSION=10.0.0
      - WA_BAILEYS_USE_PAIRING_CODE=false
    depends_on:
      evolution_postgres:
        condition: service_healthy
      evolution_redis:
        condition: service_healthy

  evolution_postgres:
    image: postgres:15-alpine
    container_name: evolution_postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=evolution123
      - POSTGRES_DB=evolution
    ports:
      - "5433:5432" # Expuesto en 5433 localmente por si ya hay un postgres en 5432
    volumes:
      - evolution_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution_redis:
    image: redis:7-alpine
    container_name: evolution_redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6380:6379"
    volumes:
      - evolution_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 🚀 NUESTRO SERVICIO: API WRAPPER (SAAS)
  whatsapp-api:
    build: .
    container_name: whatsapp_api_wrapper
    restart: always
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - EVOLUTION_API_URL=http://evolution_api:8080 # Comunicación interna Docker
      - EVOLUTION_GLOBAL_API_KEY=${EVOLUTION_GLOBAL_API_KEY:-super_secret_key_123}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - BACKEND_WEBHOOK_URL=http://whatsapp_api_wrapper:3000/api/v1/webhooks
    depends_on:
      - evolution-api
    volumes:
      - ./public:/app/public # Sincronización en tiempo real para el Dashboard

volumes:
  evolution_pg_data:
  evolution_redis_data:

