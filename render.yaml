services:
  # 1. EL MOTOR (Evolution API)
  - type: web
    name: evolution-api
    plan: free
    env: image # Requerido por Render para imágenes externas
    image:
      url: atendai/evolution-api:v1.8.3 # Formato de objeto para evitar error de unmarshal
    region: oregon
    envVars:
      - key: DATABASE_PROVIDER
        value: postgresql
      - key: DATABASE_CONNECTION_URI
        sync: false
      - key: CACHE_REDIS_ENABLED
        value: "true"
      - key: CACHE_REDIS_URI
        fromService:
          type: redis
          name: evolution-redis
          property: redisConnectionString # Nombre exacto de la propiedad en Render
      - key: AUTHENTICATION_TYPE
        value: apikey
      - key: AUTHENTICATION_API_KEY
        value: super_secret_key_123
      - key: AUTHENTICATION_EXPOSE_IN_ENV
        value: "true"
      - key: SERVER_URL
        value: https://evolution-api.onrender.com

  # 2. NUESTRO WRAPPER (La API SaaS)
  - type: web
    name: whatsapp-api-wrapper
    plan: free
    env: docker
    dockerContext: .
    dockerfilePath: Dockerfile
    region: oregon
    envVars:
      - key: PORT
        value: 3000
      - key: EVOLUTION_API_URL
        value: http://evolution-api:8080
      - key: EVOLUTION_GLOBAL_API_KEY
        value: super_secret_key_123
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: BACKEND_WEBHOOK_URL
        value: https://whatsapp-api-wrapper.onrender.com/api/v1/webhooks

  # 3. REDIS (Para velocidad)
  - type: redis
    name: evolution-redis
    plan: free
    region: oregon
    ipAllowList: []
